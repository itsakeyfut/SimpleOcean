name: タスク
description: 実装・設定などの作業タスク
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何をするか（1〜3行）
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 目的・背景
      description: なぜ必要か。何が実現・解決されるか。前提となる Issue があれば `Ref #番号` で書く
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 作業内容
      description: チェックリストで分解する
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 何を確認できたら Close するか（客観的に判定できる形で）
      value: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 参考資料
      description: ドキュメント、論文、エンジンのソースの場所など